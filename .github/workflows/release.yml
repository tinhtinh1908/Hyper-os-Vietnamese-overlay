name: Tự động phát hành

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/**'
      - 'README.md'
      - 'LICENSE'
      - 'CHANGELOG.md'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version
        id: bump
        run: |
          set -e

          CUR_VERSION=$(grep -m1 '^version=' module.prop | cut -d'=' -f2)      # e.g. v1.1.1
          CUR_CODE=$(grep -m1 '^versionCode=' module.prop | cut -d'=' -f2)     # e.g. 2

          BASE=${CUR_VERSION#v}                # 1.1.1
          MAJOR=$(echo "$BASE" | cut -d. -f1)
          MINOR=$(echo "$BASE" | cut -d. -f2)
          PATCH=$(echo "$BASE" | cut -d. -f3)

          NEW_PATCH=$((PATCH + 1))
          NEW_BASE="${MAJOR}.${MINOR}.${NEW_PATCH}"
          NEW_VERSION="v${NEW_BASE}"
          NEW_CODE=$((CUR_CODE + 1))

          echo "Bumping ${CUR_VERSION} (code ${CUR_CODE}) -> ${NEW_VERSION} (code ${NEW_CODE})"

          # update module.prop
          sed -i "s/^version=.*/version=${NEW_VERSION}/" module.prop
          sed -i "s/^versionCode=.*/versionCode=${NEW_CODE}/" module.prop

          # update update.json — static link, always points to newest release
          REPO="${GITHUB_REPOSITORY}"
          ZIP_NAME="DTINH-Overlay.zip"
          ZIP_URL="https://github.com/${REPO}/releases/latest/download/${ZIP_NAME}"

          sed -i "s#\"version\": \".*\"#\"version\": \"${NEW_VERSION}\"#" update.json
          sed -i "s#\"versionCode\": [0-9]*#\"versionCode\": ${NEW_CODE}#" update.json
          sed -i "s#\"zipUrl\": \".*\"#\"zipUrl\": \"${ZIP_URL}\"#" update.json

          echo "new_version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "new_base=${NEW_BASE}" >> "$GITHUB_OUTPUT"
          echo "zip_name=${ZIP_NAME}" >> "$GITHUB_OUTPUT"

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add module.prop update.json
          git commit -m "chore: bump version to ${{ steps.bump.outputs.new_version }} [skip ci]"
          git push

      - name: Package zip
        run: |
          ZIP_NAME="${{ steps.bump.outputs.zip_name }}"
          zip -r "$ZIP_NAME" . \
            -x ".git/*" \
            -x ".github/*" \
            -x "*.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.bump.outputs.new_base }}
          name: ${{ steps.bump.outputs.new_version }}
          body_path: CHANGELOG.md
          files: ${{ steps.bump.outputs.zip_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
